name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WatchScan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WatchScan-apk
          path: WatchScan.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest WatchScan.apk \
            --title "WatchScan build ${{ github.run_number }}" \
            --notes "Install WatchScan.apk on the watch. Built from ${{ github.sha }}." \
            --target ${{ github.sha }}
